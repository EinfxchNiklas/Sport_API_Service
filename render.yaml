databases:
  - name: sport-dashboard-db
    plan: free
    databaseName: sportdb
    user: sport

services:
  - type: web
    name: sport-dashboard-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sport-dashboard-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ENV
        value: production
      - key: API_FOOTBALL_KEY
        sync: false
      - key: TANK01_KEY
        sync: false
