services:
  - type: web
    name: sport-dashboard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Kein buildCommand/startCommand/preDeployCommand: Der Start-Befehl steht im Dockerfile (CMD) und führt
    # erst "alembic upgrade head" und dann uvicorn aus (preDeployCommand gibt es auf Render nur für bezahlte Dienste).
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_ENV
        value: production
      - key: WHOSCORED_ENABLED
        value: "true"
      - key: WHOSCORED_LEAGUES
        value: GER-Bundesliga
      - key: WHOSCORED_HEADLESS
        value: "true"
      - key: TANK01_KEY
        sync: false
